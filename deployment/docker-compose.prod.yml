services:
  caddy:
    image: caddy:2.8-alpine
    container_name: codelab-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@codelab.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend/dist:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    networks:
      - codelab-prod-net

  postgres:
    image: postgres:18-alpine
    container_name: codelab-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-codelab}
      POSTGRES_USER: ${DB_USER:-codelab_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - codelab-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codelab_user} -d ${DB_NAME:-codelab}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.8'

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: codelab-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-codelab}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-codelab_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      CONTENT_STORAGE_PATH: /var/lib/codelab/content
    volumes:
      - codelab_prod_content:/var/lib/codelab/content
    networks:
      - codelab-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'

  runner:
    build:
      context: ../runner
      dockerfile: Dockerfile
    container_name: codelab-runner-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CODELAB_API_URL: http://backend:8080/api/v1/runner
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      WORKER_ID: runner-prod-01
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - codelab_prod_runner_tmp:/tmp/codelab
    networks:
      - codelab-prod-net
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'

networks:
  codelab-prod-net:
    driver: bridge
    internal: false

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  codelab_prod_content:
  codelab_prod_runner_tmp:

