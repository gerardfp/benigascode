services:
  caddy:
    image: caddy:2.8-alpine
    container_name: benigascode-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@benigascode.local}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - benigascode-prod-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: benigascode-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - benigascode-prod-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  postgres:
    image: postgres:18-alpine
    container_name: benigascode-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-benigascode}
      POSTGRES_USER: ${DB_USER:-benigascode_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql
    networks:
      - benigascode-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-benigascode_user} -d ${DB_NAME:-benigascode}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '0.8'

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: benigascode-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-benigascode}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-benigascode_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      CONTENT_STORAGE_PATH: /var/lib/benigascode/content
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-https://${DOMAIN_NAME:-localhost}/auth/github/callback}
      INITIAL_TEACHER_GITHUB_USERNAMES: ${INITIAL_TEACHER_GITHUB_USERNAMES:-gerardfp}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
    volumes:
      - benigascode_prod_content:/var/lib/benigascode/content
    networks:
      - benigascode-prod-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'

  runner:
    build:
      context: ../runner
      dockerfile: Dockerfile
    container_name: benigascode-runner-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BENIGASCODE_API_URL: http://backend:8080/api/v1/runner
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      WORKER_ID: runner-prod-01
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - benigascode_prod_runner_tmp:/tmp/benigascode
    networks:
      - benigascode-prod-net
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'

networks:
  benigascode-prod-net:
    driver: bridge
    internal: false

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  benigascode_prod_content:
  benigascode_prod_runner_tmp:

