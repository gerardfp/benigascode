services:
  postgres:
    image: postgres:18-alpine
    container_name: benigascode-postgres-dev
    environment:
      POSTGRES_DB: benigascode
      POSTGRES_USER: benigascode_user
      POSTGRES_PASSWORD: benigascode_password
    ports:
      - "5432:5432"
    volumes:
      - benigascode_postgres_dev_data:/var/lib/postgresql/data
    networks:
      - benigascode-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benigascode_user -d benigascode"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: benigascode-backend-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/benigascode
      SPRING_DATASOURCE_USERNAME: benigascode_user
      SPRING_DATASOURCE_PASSWORD: benigascode_password
      RUNNER_TOKEN: dev_runner_token_secure_12345
      CONTENT_STORAGE_PATH: /var/lib/benigascode/content
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:3000/teacher/sync/github/callback}
    volumes:
      - ../content-example:/var/lib/benigascode/content
    ports:
      - "8080:8080"
    networks:
      - benigascode-dev-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ../runner
      dockerfile: Dockerfile
    container_name: benigascode-runner-dev
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BENIGASCODE_API_URL: http://backend:8080/api/v1/runner
      RUNNER_TOKEN: dev_runner_token_secure_12345
      WORKER_ID: runner-dev-01
      MAX_CONCURRENT_JOBS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - benigascode_runner_tmp:/tmp/benigascode
    networks:
      - benigascode-dev-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: benigascode-frontend-dev
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - benigascode-dev-net

networks:
  benigascode-dev-net:
    driver: bridge

volumes:
  benigascode_postgres_dev_data:
  benigascode_content_data:
  benigascode_runner_tmp:

