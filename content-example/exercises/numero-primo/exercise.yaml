  - "bucles"
  - "optimizacion"
  - "java"
language: "java"
runtime: "java-21"

compile:
  command: "javac Main.java"
  timeout_seconds: 10

execution:
  command: "java Main"
  timeout_seconds: 3
  memory_limit_mb: 256
