    - id: "pub-02"
      name: "Número compuesto par"
      weight: 20.0
      input: "public-tests/test-02.in"
      expected: "public-tests/test-02.out"
  private:
    - id: "priv-01"
      name: "Caso frontera uno (no primo)"
      weight: 30.0
      input: "private-tests/test-03.in"
      expected: "private-tests/test-03.out"
    - id: "priv-02"
      name: "Número primo grande de tres cifras"
      weight: 30.0
