spring:
  application:
    name: codelab-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/codelab}
    username: ${SPRING_DATASOURCE_USERNAME:codelab_user}
    password: ${SPRING_DATASOURCE_PASSWORD:codelab_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: false # Activado en prod
        name: JSESSIONID

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when_authorized

codelab:
  runner:
    token: ${RUNNER_TOKEN:dev_runner_token_secure_12345}
  content:
    storage-path: ${CONTENT_STORAGE_PATH:/var/lib/codelab/content}

